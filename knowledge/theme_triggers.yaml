# テーマ別の「見出しの語」(件数の急増を検知するための辞書。events/burst.py。DECISIONS D37・D39)
#
# 足切りは1件ごとの注目度で判定する。ところが「別々の会社の不正アクセスが連日報じられる」ような話題は、
# 1件ずつは媒体数が1で、注目度の上位5%に入らない(2026-10-07 に発覚。サイバー関連が毎日17〜107件出ても通過0件だった)。
# そこで、テーマごとに「語を含む見出しの件数」を日ごとに数え、普段より急に増えたテーマを別枠で通す。
# docs/THEMES.md のすべてのテーマ(P・F・M・G・E)を入れてある。辞書に無い話題は、events/terms.py の
# 「急増した語」の検知が拾う(語の追加は、それが出たときに足す)。
#
# words             見出しにこのどれかを含めば、そのテーマの記事として数える
#                   (短すぎる一般語は入れない。例:「金利」は入れず「利上げ」「日銀」など。広い語は min_count を高くする)
# min_count         1日の件数の下限(これ未満は、倍率が高くても急増としない。小さい数のぶれを避ける)
# ratio             過去の中央値の何倍で急増とするか(省略時は設定の burst_ratio)
# cold_start_count  比べる履歴が少ない間(14日未満)の絶対値の基準。書いたテーマだけ検知する
#                   (履歴が4日以上あれば、書かなくても、その間の中央値との比で検知する。4日未満の間は、書いたテーマだけ)


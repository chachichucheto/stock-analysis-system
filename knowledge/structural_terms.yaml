# 構造変化の見出しの辞書(events/structural.py。DECISIONS D46)
#
# 産業の力関係・供給網・需要の向きを変える報道を、媒体数に関係なく入力パックに通すための「語の組み合わせ」。
# each_of: グループのリスト。各グループの語のどれかを見出しに含み、かつ全グループを満たすものを拾う。
# theme_id: 関係するテーマ(THEMES.md)。label: 入力パックのイベント名に使う。
# 語は「それが出たときに足す」(新しい構造変化が出て、足切りに落ちたと分かったら、ここへ足す)。
# 広すぎる単独の語(半導体・AI)は入れない。毎日大量に当たり、別枠が膨らむ。

S01:
  theme_id: P01
  label: AI半導体の供給網・力関係の変化(HBM・ベースダイ・メモリの調達先)
  each_of:
    - [HBM, NVHBM, ベースダイ, LPDDR, 広帯域メモリ, 汎用メモリ]
    - [エヌビディア, NVIDIA, TSMC, インテル, 独自仕様, 囲い込み, 内製, 提携, 集約, 脱HBM, 下請け, 迂回]

S02:
  theme_id: P01
  label: AI半導体の推論シフト(学習から推論へ、GPU以外・HBM以外の選択肢)
  each_of:
    - [推論]
    - [GPU, アクセラレータ, ASIC, 専用チップ, 半導体]
    - [エヌビディア, NVIDIA, インテル, AMD, ブロードコム, グーグル, TPU, 対抗]

S03:
  theme_id: P01
  label: 中国のAI半導体の自立(ファーウェイ・DeepSeek・CXMT・YMTC)
  each_of:
    - [DeepSeek, ディープシーク, ファーウェイ, 華為, Huawei, CXMT, 長鑫, YMTC, 長江存儲, 寒武紀, カンブリコン]
    - [チップ, 半導体, アセンド, Ascend, 事前学習, 自立, 国産, 脱エヌビディア, 脱NVIDIA, CUDA, メモリ]

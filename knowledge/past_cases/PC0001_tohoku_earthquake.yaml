case_id: PC0001
title: 東日本大震災
event_date: 2011-03-11
event_summary: >
  2011年3月11日14時46分、三陸沖を震源とするM9.0の巨大地震が発生(気象庁名称:平成23年
  東北地方太平洋沖地震)。宮城県栗原市で震度7を観測し、巨大津波により東北地方沿岸部に
  甚大な被害が出た。東京電力福島第一原子力発電所では炉心溶融・水素爆発が発生し、原子力
  災害に発展した。

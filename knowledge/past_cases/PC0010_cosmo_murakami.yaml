notes: >
  大量保有報告書の提出・宣言そのものが材料となり続けた息の長い攻防で、事実関係の
  節目(2022年4月の5%超保有判明、2023年1月6日の20%以上宣言、2023年4月14日の
  変更報告書で20.01%保有確定)が複数ある。ここでは市場の思惑が最も強く動いた
  2023年1月6日の宣言を起点とした。

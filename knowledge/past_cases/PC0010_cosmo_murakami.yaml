case_id: PC0010
title: 村上ファンド系によるコスモエネルギーHD大量保有・攻防
event_date: 2023-01-06
event_summary: >
  旧村上ファンド系(シティインデックスイレブンス等)は2022年4月にコスモエネルギー
  ホールディングス株の5%超保有が判明していたが、2023年1月6日、村上氏側は大量保有
  報告書ベースで保有比率を20%以上まで引き上げる意向を一方的に宣言した。コスモ側は
  対抗措置(買収防衛策)を導入し、2023年を通じて経営陣との攻防が続いた。

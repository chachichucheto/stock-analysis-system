notes: >
  「光電融合」はこの2023年のサービス開始以降、生成AI・データセンターの消費電力
  問題と結び付けられて2024年以降さらに注目が高まったテーマである。次世代の
  光電融合スイッチの商用化は2026年に計画されており、テーマの温度が段階的に
  上がってきた事例として、他の生成AI関連事例(PC0008、PC0027)と合わせて参照する
  とよい。

case_id: PC0025
title: NTT IOWN商用サービス開始(光電融合テーマの起点)
event_date: 2023-03-16
event_summary: >
  2023年3月16日、NTT東日本・西日本は次世代通信基盤構想「IOWN」の最初の商用サービス
  「APN IOWN 1.0」の提供を開始した。光の波長を端から端まで使い、従来比200倍の
  低遅延・最大100Gbpsの帯域を実現するとされ、電力を光で置き換える「光電融合」技術が
  新たな投資テーマとして注目されるきっかけとなった。

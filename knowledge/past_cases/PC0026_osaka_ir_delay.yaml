notes: >
  【失敗/期待先行例】認定という「予定日型」の起動条件は満たされたものの、
  開業という最終的な実需の顕在化は当初想定より1年程度後ろ倒しとなった。
  「認定=材料出尽くし」なのか「開業までまだ長い=まだ早い」なのか、市場の
  受け止め方が分かれた事例として記録する。

case_id: PC0026
title: 大阪IR区域整備計画認定と開業延期
event_date: 2023-04-14
event_summary: >
  2023年4月14日、国土交通大臣が大阪・夢洲地区の特定複合観光施設(IR)区域整備計画を
  認定し、国内初のカジノを含む統合型リゾートの実現に向けて動き出した。しかし
  審査の遅れや物価上昇の影響で、認定時点で2029年秋〜冬ごろとされていた開業時期は
  同年9月の計画修正で2030年秋ごろに後ろ倒しされ、初期投資額も約1,900億円増の
  約1兆2,700億円に修正された。

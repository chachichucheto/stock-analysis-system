case_id: PC0003
title: 令和6年能登半島地震
event_date: 2024-01-01
event_summary: >
  2024年1月1日16時10分頃、石川県能登地方を震源とするM7.6・最大震度7の地震が発生
  (令和6年能登半島地震)。輪島市・志賀町などで震度7を観測し、北陸電力志賀原子力発電所
  でも変圧器の不具合などが確認された。

case_id: PC0002
title: 熊本地震
event_date: 2016-04-14
event_summary: >
  2016年4月14日21時26分にM6.5・最大震度7の「前震」が熊本県益城町で発生。気象庁観測史上
  初めて、その約28時間後の4月16日1時25分にM7.3・最大震度7の「本震」が発生した。熊本県
  菊陽町にはソニーの半導体(イメージセンサー)工場があり、被災によりサプライチェーンが
  混乱した。

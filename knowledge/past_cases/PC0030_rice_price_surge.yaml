case_id: PC0030
title: コメ価格高騰・政府備蓄米放出方針転換(令和のコメ騒動)
event_date: 2025-02-14
event_summary: >
  令和6年(2024年)産米の価格が右肩上がりで上昇し、2025年1月以降は関東銘柄米などで
  前年比約3倍の水準に達する「令和のコメ騒動」が発生した。2024年10月時点では
  政府は備蓄米放出に慎重だったが、価格高騰が続いたことを受けて方針を転換し、
  2025年1月31日に備蓄米の運用ルールを見直したうえで、2025年2月14日に政府備蓄米の
  放出を正式決定した。

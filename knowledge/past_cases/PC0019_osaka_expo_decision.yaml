case_id: PC0019
title: 大阪・関西万博 開催地決定
event_date: 2018-11-23
event_summary: >
  2018年11月23日(現地時間)、パリで開催された第164次BIE(博覧会国際事務局)総会で
  投票が行われ、決選投票で日本(大阪)が92票、ロシア(エカテリンブルク)が61票を獲得し、
  2025年国際博覧会(大阪・関西万博)の開催地が大阪・夢洲に決定した。会期は
  2025年4月13日〜10月13日(当初発表時点では5月3日〜11月3日案)。
theme_ids: [M24, M28]
time_type: 予定日

notes: >
  熊本地震(PC0002)で被災したソニーの半導体拠点と同じ地域に、国策級の巨大投資が
  行われた点で対比できる。「熊本=半導体」という投資家の連想が地震報道と工場進出
  報道の両方で繰り返し働いていることが確認できる。

case_id: PC0029
title: TSMC熊本第1工場(JASM)開所式
event_date: 2024-02-24
event_summary: >
  2024年2月24日、台湾TSMCが主導する日本の半導体製造合弁会社JASM(ソニーグループ・
  デンソーが出資)の熊本第1工場が開所式を迎えた。TSMC創業者モリス・チャンや
  トヨタ自動車の豊田章男会長らが出席し、同年10〜12月期の量産開始が予定された。
  同日には第2工場建設(2027年稼働予定)への政府支援も発表された。

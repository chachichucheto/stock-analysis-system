case_id: PC0028
title: トヨタ「MIRAI」発売・水素社会への期待
event_date: 2014-12-15
event_summary: >
  2014年12月15日、トヨタ自動車は世界初の量産型燃料電池自動車(FCEV)「MIRAI」を
  発売した。発売直後から約1000台の注文を受けるなど好調な滑り出しとなり、
  「水素社会」の到来への期待から水素ステーション整備・水素関連部材メーカーの
  株式が広く物色された。

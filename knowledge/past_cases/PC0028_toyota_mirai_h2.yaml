notes: >
  【失敗/期待先行例】発売から10年以上が経過した現在も燃料電池車の普及は限定的で、
  水素ステーション網の整備や量産効果によるコスト低下は当初期待されたペースより
  大きく遅れている。「テーマの誕生」から実需の顕在化までの期間が非常に長い、
  あるいは実現しなかった可能性がある事例として、生成AI(PC0008)やフィジカルAI
  (PC0016)のような足の速いテーマと対比する目的で記録した。

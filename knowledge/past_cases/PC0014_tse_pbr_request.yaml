case_id: PC0014
title: 東証「資本コストや株価を意識した経営」要請
event_date: 2023-03-31
event_summary: >
  2023年3月31日、東京証券取引所はプライム市場・スタンダード市場の全上場会社に対し
  「資本コストや株価を意識した経営の実現に向けた対応」を要請した。プライム市場の
  約半数、スタンダード市場の約6割がROE8%未満・PBR1倍割れという状況が背景にあり、
  自己株買いや政策保有株縮減など資本効率改善への取り組みが広く物色された。

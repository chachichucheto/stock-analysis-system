case_id: PC0018
title: 東京オリンピック 無観客開催決定
event_date: 2021-07-08
event_summary: >
  新型コロナウイルスの感染拡大が続く中、2021年7月8日、政府・東京都・大会組織委員会
  等の5者協議により、東京オリンピック・パラリンピック(2021年開催)の首都圏会場での
  無観客開催が決定した。2013年の招致決定時に見込まれていたインバウンド・輸送特需は
  実現しなかった。

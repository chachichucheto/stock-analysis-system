notes: >
  当事会社自体が悪材料で下落した「1段目が反応しない(むしろ逆行安)」の代表例。
  買収の帰趨(バイデン政権の中止命令→トランプ政権の承認)は2025年にまたがる長い
  経緯を持つが、ここでは市場が最初に反応した発表日を起点とする単発型として扱う。

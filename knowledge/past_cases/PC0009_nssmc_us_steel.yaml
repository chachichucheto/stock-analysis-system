case_id: PC0009
title: 日本製鉄によるUSスチール買収発表
event_date: 2023-12-18
event_summary: >
  2023年12月18日、日本製鉄は米鉄鋼大手USスチールを約141億ドル(約2兆円、1株55ドル)で
  買収し完全子会社化すると発表した。発表前日終値に対し約4割のプレミアムだったことも
  あり、財務負担への警戒から発表翌日(19日)の東京市場で日本製鉄株は一時6%下落した。
  その後米国で政治問題化し、バイデン大統領が2025年1月に買収中止命令を出したが、
  トランプ大統領が一転承認し2025年6月18日に買収が完了した。

case_id: PC0016
title: NVIDIA CES2025基調講演「フィジカルAI」発表
event_date: 2025-01-06
event_summary: >
  2025年1月6日(現地時間)、米NVIDIAのジェンスン・フアンCEOはCES2025の基調講演で、
  AIが知覚AI・生成AIに続き「フィジカルAI(現実世界で認識・推論・計画・行動できるAI)」
  の段階に入りつつあると位置づけ、ロボット向け基盤モデル群「Cosmos」などを発表した。
  「汎用ロボットにとってのChatGPTの瞬間はすぐそこまで来ている」と述べたことが
  広く報じられ、日本のロボット・自動化関連株が物色された。

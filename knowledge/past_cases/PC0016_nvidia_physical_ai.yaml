notes: >
  「フィジカルAI」という言葉自体は2025年1月のCESで注目を集めたが、2026年のCESでも
  同様のメッセージ(「ChatGPT moment for physical AI」)が繰り返されており、
  テーマとしてまだ実現(量産・普及)を伴っていない「期待先行」段階にある点に注意。

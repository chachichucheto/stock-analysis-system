case_id: PC0012
title: Facebookの「Meta」への社名変更・メタバース相場
event_date: 2021-10-28
event_summary: >
  2021年10月28日、米Facebook社はオンラインカンファレンス「Connect 2021」で社名を
  「Meta」に変更すると発表し、マーク・ザッカーバーグCEOは「メタバースファースト」の
  方針を打ち出した。日本株でもVR・ゲーム・IP関連の「メタバース関連株」が急騰したが、
  その後1〜2年でブームは沈静化した。

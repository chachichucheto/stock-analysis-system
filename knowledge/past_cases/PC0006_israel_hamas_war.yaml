case_id: PC0006
title: イスラエル・ハマス紛争(中東情勢緊迫化)
event_date: 2023-10-07
event_summary: >
  2023年10月7日早朝、ガザ地区を実効支配するハマスの軍事部門がイスラエルに対し大規模な
  奇襲攻撃(「アクサーの氾濫」作戦)を実施し、ロケット弾攻撃と越境攻撃を行った。イスラエル
  はガザ地区への空爆で報復し、中東情勢が緊迫化。原油価格や金価格が上昇した。

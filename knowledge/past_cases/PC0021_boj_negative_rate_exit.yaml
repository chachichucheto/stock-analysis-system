notes: >
  「金利のある世界」への転換点として位置づけられ、その後2025年以降も日銀の
  追加利上げ観測のたびに銀行株が繰り返し物色されている。異次元緩和導入(PC0020)
  とは逆方向の政策転換であり、対になる事例として参照できる。

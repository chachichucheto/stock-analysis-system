case_id: PC0021
title: 日銀マイナス金利政策解除
event_date: 2024-03-19
event_summary: >
  2024年3月18〜19日の金融政策決定会合で、日本銀行はマイナス金利政策・イールド
  カーブ・コントロール(YCC)・オーバーシュート型コミットメントの「トリプル解除」を
  決定した。政策金利は無担保コール翌日物で0〜0.1%程度に引き上げられ、利上げは
  17年ぶりとなった。銀行・保険株が買われた。
theme_ids: [F06, M15]
time_type: 予定日

case_id: PC0023
title: 高市内閣発足
event_date: 2025-10-21
event_summary: >
  2025年10月21日、国会の首相指名選挙で高市早苗氏が第104代内閣総理大臣に指名され、
  同日夜に自民党と日本維新の会による連立の高市内閣が発足した。日本初の女性首相
  であり、防衛費のさらなる増額路線や積極財政、金融政策運営など経済政策の方向性に
  関心が集まった。

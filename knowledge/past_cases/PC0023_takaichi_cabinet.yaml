notes: >
  内閣発足自体は確認できたが、具体的な政策(防衛費のさらなる増額幅、金融政策への
  スタンスなど)は本レポート作成時点(2026年9月)でも順次具体化が進んでいる段階であり、
  関連銘柄への影響は暫定的なものとして扱う必要がある。`THEMES.md` の政策関連ID
  (P15・F04・F06)を仮に当てたが、高市政権固有の政策(例:戦略17分野の推進体制)が
  固まり次第、本事例の theme_ids や related を見直すべきである。

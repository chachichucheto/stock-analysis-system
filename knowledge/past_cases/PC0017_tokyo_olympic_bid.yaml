notes: >
  招致決定(2013年)から開催予定日(当初2020年7月)までの期間に、材料の鮮度がどう
  減衰したか、また新国立競技場のデザイン見直し(2015年)などの下方修正イベントが
  途中にあったことも合わせて振り返る価値がある。実際の開催は新型コロナの影響で
  2021年に延期・無観客開催となった(PC0018参照)。

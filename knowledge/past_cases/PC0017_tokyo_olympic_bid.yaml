case_id: PC0017
title: 東京オリンピック招致決定
event_date: 2013-09-08
event_summary: >
  2013年9月7日(現地時間、日本時間8日)、アルゼンチン・ブエノスアイレスで開催された
  第125次IOC総会において、2020年夏季オリンピック・パラリンピックの開催都市に
  東京が決定した。1964年以来56年ぶりの開催で、新国立競技場の建設や選手村整備、
  インバウンド需要の拡大期待から建設・不動産・観光関連株が大きく買われた。

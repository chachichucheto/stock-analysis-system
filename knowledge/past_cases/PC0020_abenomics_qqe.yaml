case_id: PC0020
title: アベノミクス第一の矢・異次元金融緩和
event_date: 2013-04-04
event_summary: >
  2013年4月4日、就任間もない黒田東彦・日本銀行総裁のもとで日銀は「量的・質的金融
  緩和」(異次元緩和)の導入を決定した。マネタリーベースを2年間で2倍にする大規模な
  国債買い入れなどを柱とし、急速な円安・株高が進んだ「アベノミクス相場」の起点と
  なった。

notes: >
  「アベノミクス」はその後数年にわたるテーマとしての性格が強いが、ここでは
  市場が最も強く反応した2013年4月4日の量的・質的金融緩和の決定を起点の
  単一イベントとして記録した。日銀のマイナス金利解除(PC0021)は、その逆方向の
  転換点として対比できる。

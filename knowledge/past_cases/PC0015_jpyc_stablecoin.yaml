case_id: PC0015
title: 円建てステーブルコイン「JPYC」発行開始
event_date: 2025-10-27
event_summary: >
  フィンテック企業JPYC(東京・千代田)は2025年10月27日、日本円と1対1で交換できる
  ステーブルコイン「JPYC」の発行を専用プラットフォーム「JPYC EX」で開始した。
  日本円と資金決済法に基づく国内初の円建てステーブルコインとされ、2025年は
  「ステーブルコイン元年」と位置づけられた。

case_id: PC0007
title: ファイザー製ワクチン有効性発表
event_date: 2020-11-09
event_summary: >
  2020年11月9日、米ファイザー社は開発中の新型コロナワクチンについて、第3相臨床試験の
  中間解析で90%を超える発症予防効果が確認されたと発表した。経済再開・渡航再開への
  期待から、いわゆる「ワクチン相場」でグロース株から出遅れ景気敏感株・旅行関連株への
  資金シフトが起きた。

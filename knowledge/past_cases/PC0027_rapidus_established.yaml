case_id: PC0027
title: 次世代半導体新会社ラピダス設立発表
event_date: 2022-11-11
event_summary: >
  2022年11月11日、次世代半導体の国産化を目指す新会社「Rapidus(ラピダス)」の設立が
  発表された。トヨタ自動車・NTT・ソニーグループなど国内企業8社が出資し、政府も
  700億円の助成を表明。2027年の2nmロジック半導体の量産技術確立を目指すとされ、
  日本の半導体復権の象徴的なニュースとして半導体関連株が広く物色された。

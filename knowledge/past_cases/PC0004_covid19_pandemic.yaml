case_id: PC0004
title: 新型コロナウイルス感染拡大
event_date: 2020-01-16
event_summary: >
  2020年1月16日、日本国内で新型コロナウイルスの感染者が初めて確認された。その後
  世界的に感染が拡大し、2020年1月30日にWHOが「国際的に懸念される公衆衛生上の緊急
  事態」を宣言。2月下旬から世界的な株安が進み、日本でも2020年4月7日に緊急事態宣言が
  発出された。

case_id: PC0008
title: ChatGPT公開
event_date: 2022-11-30
event_summary: >
  2022年11月30日、米OpenAIが対話型AI「ChatGPT」(GPT-3.5ベース)を誰でも無料で使える
  形で公開した。リリースから5日で利用者100万人を突破するなど急速に普及し、生成AI
  ブームの起点となった。日本株でも半導体・データセンター関連が大きく物色された。

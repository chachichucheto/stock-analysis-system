notes: >
  ロシアのウクライナ侵攻(PC0005)を背景に「シナリオが強化された」典型例。
  ウクライナ侵攻直後の防衛関連株の反応と、実際に予算・法制度が固まった本閣議決定
  時点での反応を比較することで、「事実の確定度」による反応の違いを検証できる。

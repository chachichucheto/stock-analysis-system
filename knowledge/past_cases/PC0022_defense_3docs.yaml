case_id: PC0022
title: 安保三文書閣議決定・防衛費GDP比2%目標
event_date: 2022-12-16
event_summary: >
  2022年12月16日、岸田文雄内閣は「国家安全保障戦略」「国家防衛戦略」「防衛力整備
  計画」のいわゆる安保三文書を閣議決定した。相手のミサイル発射拠点等を攻撃する
  「反撃能力」の保有を明記し、2027年度までに防衛関係費をGDP比2%程度に達するよう
  する方針を打ち出した(2023〜27年度の5年間で総額約43兆円)。

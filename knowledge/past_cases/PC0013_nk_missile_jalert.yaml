case_id: PC0013
title: 北朝鮮弾道ミサイル発射・Jアラート発令
event_date: 2022-10-04
event_summary: >
  2022年10月4日朝、北朝鮮が発射した弾道ミサイルが日本上空を通過し、東北地方などに
  Jアラート(全国瞬時警報システム)が発令された。防衛関連株が一時物色されたが、
  反応は小幅・短時間にとどまった。

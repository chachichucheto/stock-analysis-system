notes: >
  【失敗例】北朝鮮のミサイル発射・Jアラート発令は2022年以降複数回発生しており、
  繰り返されるたびに材料としての新規性(サプライズ度)が薄れ、防衛関連株の反応は
  短時間・小幅にとどまりやすい。安保三文書閣議決定(PC0022)のような制度変更を伴う
  ニュースと異なり、単発の発射報道だけでは持続的な上昇につながりにくいことを
  示す事例として記録した。

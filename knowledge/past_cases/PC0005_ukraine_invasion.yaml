case_id: PC0005
title: ロシアによるウクライナ侵攻
event_date: 2022-02-24
event_summary: >
  2022年2月24日、ロシアがウクライナへの本格的な軍事侵攻を開始した。北(ベラルーシ
  経由)・東(ドンバス)・南(クリミア)の3方向からの侵攻で、原油・天然ガス・穀物などの
  資源価格が急騰し、日本でも防衛・資源・エネルギー安全保障関連の物色が強まった。

case_id: PC0024
title: 消費税率10%への引き上げ・軽減税率制度導入
event_date: 2019-10-01
event_summary: >
  2019年10月1日、消費税率が8%から10%に引き上げられた(2015年10月の予定から2度の
  延期を経て実施)。同時に、酒類・外食を除く飲食料品等を対象に税率を8%に据え置く
  軽減税率制度が導入された。増税に伴う消費の落ち込み懸念から小売・外食株が売られる
  一方、キャッシュレス決済のポイント還元策などが並行して実施され、関連銘柄が
  物色された。
theme_ids: [F01]
time_type: 予定日

notes: >
  「予定日型」の典型例で、施行日の数か月前から駆け込み需要・軽減税率対応の報道が
  先行し、施行後は反動減が話題になるという、材料の賞味期限が施行日を挟んで
  前後に伸びる特徴を持つ。将来の消費税率変更(引き下げを含む)の議論を評価する際の
  比較対象として有用。

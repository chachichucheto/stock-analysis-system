case_id: PC0011
title: フジ・メディアHD 中居正広氏問題によるガバナンス不祥事
event_date: 2025-01-17
event_summary: >
  2024年末に報じられたタレント中居正広氏を巡るトラブルについて、2025年1月17日に
  フジテレビの港浩一社長が記者会見を開き、社員の関与を否定した上で第三者委員会を
  設置すると発表した。米アクティビストのダルトン・インベストメンツは1月14日付書簡で
  第三者委員会の設置を要求するなど、スポンサー離れとガバナンス問題が急速に表面化した。

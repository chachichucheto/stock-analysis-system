# 設定ファイルの見本。config/config.yaml にコピーして編集する(config.yaml は git に入れない)。
# パスは Windows でもそのまま書ける(例: D:/stock/data)。相対パスはリポジトリの直下からの位置。

paths:
  data_dir: data                 # DB・生データ・記録・レポートの置き場所
  backup_dir: ""                 # 追記専用の記録の複製先。OneDrive のフォルダがおすすめ(docs/HANDOFF.md「バックアップ」)。空なら複製しない

prices:
  # 既存の株価DBの読み方。S1 の確認結果に合わせて変更する(docs/DESIGN.md §11)
  source: csv_dir                # csv_dir | yfinance_live
  csv_dir: ""                    # source=csv_dir のとき、銘柄ごとの CSV が入ったフォルダ(例: D:/stock/prices)
  csv_filename: "{code}.csv"     # 例: 7203.csv。列は date, open, high, low, close, volume
  topix_code: "1306"             # TOPIX の代わりに使う ETF

edinet:
  api_key: ""                    # EDINET API のキー(無料登録)

collect:
  rss_feeds:
    - name: NHK 主要ニュース
      url: https://www.nhk.or.jp/rss/news/cat0.xml
      tier: 2
    - name: NHK 経済
      url: https://www.nhk.or.jp/rss/news/cat5.xml
      tier: 2
    - name: NHK 国際
      url: https://www.nhk.or.jp/rss/news/cat6.xml
      tier: 2
    - name: NHK 政治
      url: https://www.nhk.or.jp/rss/news/cat4.xml
      tier: 2
    - name: Yahoo!ニュース 経済          # 各社の記事の集約。媒体数を数える材料にもなる(要確認:URL)
      url: https://news.yahoo.co.jp/rss/topics/business.xml
      tier: 2
    - name: Yahoo!ニュース 国内
      url: https://news.yahoo.co.jp/rss/topics/domestic.xml
      tier: 2
    - name: Yahoo!ニュース IT
      url: https://news.yahoo.co.jp/rss/topics/it.xml
      tier: 2
    - name: Google ニュース トップ
      url: https://news.google.com/rss?hl=ja&gl=JP&ceid=JP:ja
      tier: 2
  # 注目度の計測用のキーワード(Google News・GDELT)。THEMES.md の主なテーマから。増やしすぎると収集が遅くなる
  google_news_queries:
    - 半導体
    - 生成AI
    - データセンター
    - 防衛
    - 造船
    - 量子コンピュータ
    - 宇宙
    - サイバーセキュリティ
    - 原発
    - 核融合
    - 国土強靱化
    - レアアース
    - 消費税減税
    - 日銀 利上げ
    - 円安
    - インバウンド
    - TOB
    - アクティビスト
    - 大量保有報告書
    - 地震
  # 一般の関心を測る Wikipedia(日本語版)の記事名。記事名は正確に(存在しない記事は 0 になる)
  wikipedia_articles:
    - 半導体
    - 生成的人工知能
    - データセンター
    - 防衛費
    - 量子コンピュータ
    - 核融合炉
    - 原子力発電
    - レアアース
    - 消費税
    - 日本銀行
    - 訪日外国人旅行
    - 南海トラフ巨大地震
  # JPX の上場銘柄一覧(Excel)。URL が変わることがあるので、取れないときは JPX のサイトで確認する
  jpx_universe_url: https://www.jpx.co.jp/markets/statistics-equities/misc/tvdivq0000001vg2-att/data_j.xls
  earnings_schedule_url: ""      # 決算発表予定日の一覧(配布 URL は S1 で確認する)
  request_interval_sec: 1.0      # 取得の間隔(相手先に負荷をかけない)
  user_agent: "assoc-research/0.1 (personal use)"

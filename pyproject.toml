[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assoc"
version = "0.1.0"
description = "ニュース連想モデル(docs/CONCEPT.md)"
requires-python = ">=3.11"

[project.scripts]
assoc = "assoc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
